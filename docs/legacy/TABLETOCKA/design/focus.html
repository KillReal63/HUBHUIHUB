  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  const isArray = Array.isArray;

  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;

    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();

  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;

  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();

      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },

   * @param {string} property

    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)

          typeof value === &quot;function&quot; ||

      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)

      modelContent: null,
      privateContent: null,
      ...parsedState,

      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,

      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

              /** @type {unknown} */

                return;

                pendingStateWrites.delete(id);

        return;
      }
      hostPort = nextHostPort;

    }

    if (event.target instanceof globalThis.Element) {

      return;
    }

        id = decodeURIComponent(href.slice(1));

&lt;script&gt;
(()=&gt;{
const root=document.getElementById(&#x27;focus-styles&#x27;);
const phone=root.querySelector(&#x27;.md-phone&#x27;);
const names={plum:&#x27;Слива&#x27;,dawn:&#x27;Рассвет&#x27;,tide:&#x27;Прилив&#x27;,coal:&#x27;Уголь&#x27;,glass:&#x27;Стекло&#x27;};

const top=()=&gt;`&lt;header class=&quot;md-top&quot;&gt;&lt;div class=&quot;md-brand&quot;&gt;${icon(&#x27;pill&#x27;)} по времени&lt;/div&gt;&lt;div class=&quot;md-top-actions&quot;&gt;&lt;button class=&quot;md-icon-button&quot; data-action=&quot;notifications&quot; aria-label=&quot;Уведомления&quot;&gt;${icon(&#x27;bell&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;/header&gt;`;
const nav=()=&gt;`&lt;nav class=&quot;md-nav&quot; aria-label=&quot;Основная навигация&quot;&gt;${[[&#x27;today&#x27;,&#x27;calendar-days&#x27;,&#x27;Сегодня&#x27;],[&#x27;meds&#x27;,&#x27;pill&#x27;,&#x27;Препараты&#x27;],[&#x27;history&#x27;,&#x27;clock-3&#x27;,&#x27;История&#x27;]].map(([id,ic,label])=&gt;`&lt;button type=&quot;button&quot; data-view=&quot;${id}&quot; class=&quot;${state.view===id?&#x27;active&#x27;:&#x27;&#x27;}&quot; ${state.view===id?&#x27;aria-current=&quot;page&quot;&#x27;:&#x27;&#x27;}&gt;${icon(ic)}${label}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/nav&gt;`;

const secondary=()=&gt;`&lt;div class=&quot;md-hero-footer&quot;&gt;&lt;button class=&quot;md-text-button&quot; data-action=&quot;${state.taken?&#x27;undo&#x27;:&#x27;delay&#x27;}&quot;&gt;${state.taken?&#x27;Отменить отметку&#x27;:state.delayed?&#x27;Вернуть на 08:30&#x27;:&#x27;Через 30 минут&#x27;}&lt;/button&gt;&lt;button class=&quot;md-text-button&quot; data-view=&quot;detail&quot;&gt;О препарате ${icon(&#x27;chevron-right&#x27;)}&lt;/button&gt;&lt;/div&gt;`;
const row=(title,desc,col,end,sub=&#x27;&#x27;)=&gt;`&lt;div class=&quot;md-row&quot;&gt;&lt;div class=&quot;md-pill-box&quot;&gt;${pill(col)}&lt;/div&gt;&lt;div class=&quot;md-row-copy&quot;&gt;&lt;b&gt;${title}&lt;/b&gt;&lt;small&gt;${desc}&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;md-row-end&quot;&gt;${end}${sub?`&lt;small&gt;${sub}&lt;/small&gt;`:&#x27;&#x27;}&lt;/div&gt;&lt;/div&gt;`;
function focus(){return `&lt;div class=&quot;md-content&quot;&gt;&lt;div class=&quot;md-focus-head&quot;&gt;&lt;span&gt;Четверг, 17 сентября&lt;/span&gt;&lt;span&gt;${state.taken?&#x27;Принято&#x27;:state.delayed?&#x27;Напомним позже&#x27;:&#x27;Ближайший приём&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;section class=&quot;md-focus-main&quot;&gt;&lt;div class=&quot;md-focus-time&quot;&gt;${time()}&lt;/div&gt;&lt;div class=&quot;md-focus-object&quot;&gt;${pill(&#x27;gold&#x27;)}&lt;/div&gt;&lt;h2&gt;Витамин D₃&lt;/h2&gt;&lt;p&gt;1 капсула · после завтрака&lt;/p&gt;&lt;/section&gt;${primary(&#x27;Я принял&#x27;)}&lt;div class=&quot;md-focus-secondary&quot;&gt;&lt;button class=&quot;md-text-button&quot; data-action=&quot;${state.taken?&#x27;undo&#x27;:&#x27;delay&#x27;}&quot;&gt;${state.taken?&#x27;Отменить отметку&#x27;:state.delayed?&#x27;Вернуть на 08:30&#x27;:&#x27;Через 30 минут&#x27;}&lt;/button&gt;&lt;button class=&quot;md-text-button&quot; data-view=&quot;detail&quot;&gt;О препарате&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;md-focus-next&quot;&gt;&lt;div&gt;&lt;small&gt;Следом&lt;/small&gt;Магний · 1 таблетка&lt;/div&gt;&lt;div&gt;&lt;small&gt;После ужина&lt;/small&gt;20:00&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;md-focus-done&quot;&gt;${icon(&#x27;check-check&#x27;)}Препарат А принят в 07:32&lt;/div&gt;&lt;div class=&quot;md-progress-line&quot;&gt;${[0,1,2].map(i=&gt;`&lt;span class=&quot;${i&lt;(state.taken?2:1)?&#x27;complete&#x27;:&#x27;&#x27;}&quot;&gt;&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;`}
function detail(magnesium=false){return `&lt;div class=&quot;md-detail-head&quot;&gt;&lt;button class=&quot;md-icon-button&quot; data-view=&quot;today&quot; aria-label=&quot;Назад&quot;&gt;${icon(&#x27;arrow-left&#x27;)}&lt;/button&gt;&lt;span&gt;Препарат&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;md-detail&quot;&gt;&lt;div class=&quot;md-pill-box&quot;&gt;${pill(magnesium?&#x27;green&#x27;:&#x27;gold&#x27;)}&lt;/div&gt;&lt;h2&gt;${magnesium?&#x27;Магний&#x27;:&#x27;Витамин D₃&#x27;}&lt;/h2&gt;&lt;p&gt;Добавка · ежедневный приём&lt;/p&gt;&lt;dl&gt;&lt;div&gt;&lt;dt&gt;Количество&lt;/dt&gt;&lt;dd&gt;${magnesium?&#x27;1 таблетка&#x27;:&#x27;1 капсула&#x27;}&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Время&lt;/dt&gt;&lt;dd&gt;${magnesium?&#x27;20:00&#x27;:time()}&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Условие приёма&lt;/dt&gt;&lt;dd&gt;После еды&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Напоминания&lt;/dt&gt;&lt;dd&gt;Включены&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;h3&gt;Сегодня&lt;/h3&gt;&lt;p&gt;${magnesium?&#x27;Приём запланирован на вечер.&#x27;:state.taken?&#x27;Приём уже отмечен.&#x27;:&#x27;Приём ещё не отмечен.&#x27;}&lt;/p&gt;&lt;div style=&quot;height:28px&quot;&gt;&lt;/div&gt;${!magnesium?primary():`&lt;button class=&quot;md-primary&quot; data-view=&quot;today&quot;&gt;Вернуться к расписанию&lt;/button&gt;`}${!magnesium&amp;&amp;state.taken?&#x27;&lt;button class=&quot;md-text-button&quot; data-action=&quot;undo&quot;&gt;Отменить отметку&lt;/button&gt;&#x27;:&#x27;&#x27;}&lt;/div&gt;`}
function meds(){return `&lt;div class=&quot;md-content&quot;&gt;&lt;div class=&quot;md-heading&quot;&gt;&lt;h2&gt;Препараты&lt;/h2&gt;&lt;span class=&quot;md-sub&quot;&gt;3 активных&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;md-sub&quot;&gt;Ваше ежедневное расписание&lt;/p&gt;${row(&#x27;Препарат А&#x27;,&#x27;1 таблетка · натощак&#x27;,&#x27;round&#x27;,&#x27;07:30&#x27;)}&lt;button data-view=&quot;detail&quot; style=&quot;width:100%;padding:0;border:0;background:transparent;color:inherit;text-align:left&quot;&gt;${row(&#x27;Витамин D₃&#x27;,&#x27;1 капсула · после еды&#x27;,&#x27;gold&#x27;,time())}&lt;/button&gt;&lt;button data-view=&quot;magnesium&quot; style=&quot;width:100%;padding:0;border:0;background:transparent;color:inherit;text-align:left&quot;&gt;${row(&#x27;Магний&#x27;,&#x27;1 таблетка · после еды&#x27;,&#x27;green&#x27;,&#x27;20:00&#x27;)}&lt;/button&gt;&lt;/div&gt;`}
function history(){return `&lt;div class=&quot;md-content&quot;&gt;&lt;div class=&quot;md-heading&quot;&gt;&lt;h2&gt;История&lt;/h2&gt;&lt;/div&gt;&lt;p class=&quot;md-sub&quot;&gt;Отметки приёма сохраняются здесь&lt;/p&gt;&lt;div class=&quot;md-history-day&quot;&gt;Сегодня, 17 сентября&lt;/div&gt;${state.taken?row(&#x27;Витамин D₃&#x27;,&#x27;Принято · 1 капсула&#x27;,&#x27;gold&#x27;,time()):&#x27;&#x27;}${row(&#x27;Препарат А&#x27;,&#x27;Принято · 1 таблетка&#x27;,&#x27;round&#x27;,&#x27;07:32&#x27;)}&lt;div class=&quot;md-history-day&quot;&gt;Вчера, 16 сентября&lt;/div&gt;${row(&#x27;Магний&#x27;,&#x27;Принято · 1 таблетка&#x27;,&#x27;green&#x27;,&#x27;20:04&#x27;)}${row(&#x27;Витамин D₃&#x27;,&#x27;Принято · 1 капсула&#x27;,&#x27;gold&#x27;,&#x27;08:36&#x27;)}${row(&#x27;Препарат А&#x27;,&#x27;Принято · 1 таблетка&#x27;,&#x27;round&#x27;,&#x27;07:31&#x27;)}&lt;/div&gt;`}
function notifications(){return `&lt;div class=&quot;md-detail-head&quot;&gt;&lt;button class=&quot;md-icon-button&quot; data-view=&quot;today&quot; aria-label=&quot;Назад&quot;&gt;${icon(&#x27;arrow-left&#x27;)}&lt;/button&gt;&lt;span&gt;Напоминания&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;md-detail&quot;&gt;&lt;h2&gt;Всё настроено&lt;/h2&gt;&lt;div style=&quot;height:20px&quot;&gt;&lt;/div&gt;&lt;div class=&quot;md-notice&quot;&gt;${icon(&#x27;bell-ring&#x27;)}Уведомления включены&lt;/div&gt;&lt;p&gt;Напомним о каждом приёме по вашему расписанию.&lt;/p&gt;&lt;dl&gt;&lt;div&gt;&lt;dt&gt;Препарат А&lt;/dt&gt;&lt;dd&gt;07:30&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Витамин D₃&lt;/dt&gt;&lt;dd&gt;${time()}&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Магний&lt;/dt&gt;&lt;dd&gt;20:00&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;button class=&quot;md-primary&quot; data-view=&quot;today&quot;&gt;К сегодняшнему дню&lt;/button&gt;&lt;/div&gt;`}
function persist(){window.openai?.setWidgetState?.({modelContent:{styleSet:&#x27;focus-five&#x27;,variant:state.variant,direction:&#x27;Фокус — &#x27;+names[state.variant],taken:state.taken,delayed:state.delayed},privateContent:{view:state.view}})?.catch(()=&gt;{})}
function render(){
phone.className=&#x27;md-phone focus &#x27;+state.variant;
let content=&#x27;&#x27;;
if(state.view===&#x27;detail&#x27;||state.view===&#x27;magnesium&#x27;)content=detail(state.view===&#x27;magnesium&#x27;);
else if(state.view===&#x27;notifications&#x27;)content=notifications();

phone.innerHTML=content+nav()+(state.toast?`&lt;div class=&quot;md-toast&quot; role=&quot;status&quot;&gt;&lt;span&gt;${state.toast}&lt;/span&gt;&lt;button data-action=&quot;${state.taken?&#x27;undo&#x27;:&#x27;dismiss&#x27;}&quot;&gt;${state.taken?&#x27;Отменить&#x27;:&#x27;Понятно&#x27;}&lt;/button&gt;&lt;/div&gt;`:&#x27;&#x27;);
root.querySelectorAll(&#x27;[data-variant]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,String(b.dataset.variant===state.variant)));
if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});
}
root.addEventListener(&#x27;click&#x27;,event=&gt;{
const button=event.target.closest(&#x27;button&#x27;);if(!button||!root.contains(button))return;
if(button.dataset.variant){state.variant=button.dataset.variant;state.toast=&#x27;&#x27;;root.querySelector(&#x27;.md-live&#x27;).textContent=&#x27;Дизайн: &#x27;+names[state.variant];}
if(button.dataset.view){state.view=button.dataset.view;state.toast=&#x27;&#x27;;}
if(button.dataset.action===&#x27;take&#x27;){if(!state.taken){state.taken=true;state.toast=&#x27;Витамин D₃ — приём отмечен&#x27;;}}
if(button.dataset.action===&#x27;undo&#x27;){state.taken=false;state.toast=&#x27;Отметка отменена&#x27;;}
if(button.dataset.action===&#x27;delay&#x27;){state.delayed=!state.delayed;state.toast=state.delayed?&#x27;Напомним в 09:00&#x27;:&#x27;Напомним в 08:30&#x27;;}

if(button.dataset.action===&#x27;notifications&#x27;){state.view=&#x27;notifications&#x27;;state.toast=&#x27;&#x27;;}

window.addEventListener(&#x27;openai:set_globals&#x27;,event=&gt;{const next=event.detail?.globals?.widgetState?.modelContent;if(!next)return;if(next.variant===state.variant&amp;&amp;next.taken===state.taken&amp;&amp;next.delayed===state.delayed)return;if(names[next.variant])state.variant=next.variant;if(typeof next.taken===&#x27;boolean&#x27;)state.taken=next.taken;if(typeof next.delayed===&#x27;boolean&#x27;)state.delayed=next.delayed;state.toast=&#x27;&#x27;;render();});
render();
})();
